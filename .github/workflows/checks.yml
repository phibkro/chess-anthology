name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir prototypes/chess-compiler install --frozen-lockfile
      - run: node --import tsx src/adapters/demo.ts
        working-directory: prototypes/chess-compiler
      - run: pnpm setup:secrets
      - run: pnpm check:all
      - run: pnpm check:secrets
      - run: pnpm commitlint --last
