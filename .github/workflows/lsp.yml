name: LSP evaluations and benchmarks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - compiler/**
      - .github/workflows/lsp.yml
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install pinned runtimes and current and historical dependencies
        shell: bash
        run: |
          npm install --global pnpm@12.16.1 bun@1.4.4
          pnpm --dir compiler install --frozen-lockfile
          git worktree add --detach "$RUNNER_TEMP/chess-node" f2068c0d8ab86c80706fa59867e127101fa51fae
          pnpm --dir "$RUNNER_TEMP/chess-node/prototypes/chess-compiler" install --frozen-lockfile
      - name: Evaluate protocol and compare server delivery modes
        shell: bash
        run: |
          python3 compiler/evaluation/lsp_compare.py --arms all --node-baseline "$RUNNER_TEMP/chess-node" --output report/lsp --blocks 16 --iterations 5 --sizes 1,10,100
          cat report/lsp/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve evaluations, protocol transcripts, samples and inference
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lsp-evaluations-and-benchmarks
          path: |
            report/lsp/*.json
            report/lsp/*.md
            report/lsp/evaluation/**/failure-transcript.json
          if-no-files-found: warn
